# Project-wide Gradle settings.
version=1.0.0
group=com.androidcicdlab

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Failure lab flags — keep these false on main so CI stays green.
# Reproduce failures locally (see scenarios/scenario-09-pipeline-failure):
#   ./gradlew testDevDebugUnitTest -Plab.failTests=true
#   ./gradlew detektFailureLab
#   ./gradlew assembleDevDebug -Plab.failBuild=true
#   ./gradlew detekt ktlintCheck -Plab.failQuality=true
# ---------------------------------------------------------------------------
lab.failTests=false
lab.failBuild=false
lab.failQuality=false
