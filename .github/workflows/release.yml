# Scenario 12 + 13 — release orchestration (CD), not local build logic.
# Signing secrets are optional. Without them the job still builds an unsigned
# (or debug-signed) bundle so the workflow stays green on a public fork.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      variant:
        description: "Gradle assemble/bundle task suffix, e.g. ProdRelease"
        required: true
        default: "ProdRelease"
      distribute:
        description: "Attempt Firebase App Distribution after a successful bundle"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    name: Signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/upload-keystore.jks"
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > "$GITHUB_WORKSPACE/keystore.properties"

      - name: Quality, tests, bundle
        run: |
          ./gradlew detekt ktlintCheck testProdReleaseUnitTest bundleProdRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: prod-release-aab
          path: app/build/outputs/bundle/prodRelease/*.aab
          if-no-files-found: error
          retention-days: 30

  firebase:
    name: Firebase App Distribution
    needs: bundle
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip without secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured. This job is a CD placeholder."
            echo "See scenarios/scenario-13-firebase-distribution and docs/artifacts.md."
            exit 0
          fi
          echo "Wire firebase-app-distribution-gradle or Firebase CLI here."
          echo "CI = build + test + verify. CD = distribute + release."
